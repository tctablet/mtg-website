<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>MTG Deck Tracker</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%83%8F%3C/text%3E%3C/svg%3E" />
    <script>
      // Gegenstück zu 404.html (GitHub Pages SPA-Fallback): stellt aus
      // ?/deck/5 wieder die echte URL /mtg-website/deck/5 her, bevor die App lädt.
      ;(function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search.slice(1).split('&').map(function (s) {
            return s.replace(/~and~/g, '&')
          }).join('?')
          window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash)
        }
      })(window.location)
    </script>
    <!-- TLS-Handshakes vorziehen: jeder externe Origin kostet mobil sonst
         ~100-300ms beim ersten Request. crossorigin nur bei CORS-Fetches. -->
    <link rel="preconnect" href="https://jcbdjlqxmlsfqfenltws.supabase.co" crossorigin />
    <link rel="preconnect" href="https://api.scryfall.com" crossorigin />
    <link rel="preconnect" href="https://cards.scryfall.io" />
    <link rel="preconnect" href="https://svgs.scryfall.io" />
    <link rel="preconnect" href="https://json.edhrec.com" crossorigin />
    <link href="//cdn.jsdelivr.net/npm/mana-font@1.18.0/css/mana.min.css" rel="stylesheet" />
  </head>
  <body>
    <div id="app">
      <nav id="nav"></nav>
      <main id="content"></main>
      <div id="card-preview"></div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
